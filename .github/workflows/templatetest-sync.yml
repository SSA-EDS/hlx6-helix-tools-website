name: templatetest - Substitute + Sync (BASE_DOMAIN)

# TEMPLATIZE TEST (SSA multi-customer DA code-sync RFC, Phase 3 / variant (a)).
# Runs against the `templatetest` branch, which holds the site with the customer domain
# replaced by the {{BASE_DOMAIN}} placeholder. On manual dispatch this workflow:
#   1. checks out templatetest,
#   2. substitutes {{BASE_DOMAIN}} -> the per-customer value (Environment variable),
#   3. commits the substituted result onto the `templatetest-synced` branch as an
#      INCREMENTAL commit (parent = the previous synced build), so its history can be
#      diffed for changed-files syncs,
#   4. triggers a code-sync of `templatetest-synced` via a signed, simulated push webhook
#      to the customer's Helix admin (same mechanism as the prototype).
#
# Sync mode (manual input, like the code-sync bot):
#   * changed-files (default) - diffs this build against the LAST synced build and syncs
#       only the added/modified/removed files. Falls back to a full sync on the first run
#       (no prior synced build to diff against).
#   * full - forces a recursive re-sync of the entire ref.
# A blank run with no changes since the last build is a no-op (nothing is pushed or synced).
#
# The synced result lands at code-bus prefix .../templatetest-synced/ and is viewable at
#   https://templatetest-synced--<repo>--<org>.<BASE_DOMAIN>.page/   -- ISOLATED from the
# live `main` site. Because substitution is the exact reverse of templatization, the output
# is byte-identical to today's production (a built-in correctness check).
#
# Requires the GitHub App (helix-eds-ca) to remain INSTALLED on the repo (admin needs it
# for content access) but it can be event-UNSUBSCRIBED (no auto-trigger) - this workflow
# POSTs the webhook directly, unaffected by the App's event subscriptions.
#
# See: https://wiki.corp.adobe.com/spaces/MSTeam/pages/3990094266

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (changed-files diffs against the last synced build; full forces a recursive re-sync of everything)"
        required: true
        type: choice
        options:
          - changed-files
          - full
        default: changed-files
      files:
        description: "Space-separated file paths to sync (optional override; paths are as they appear in the code bus / post-substitution tree; leave blank to auto-detect)"
        required: false
        default: ""

permissions:
  contents: write   # needed to push the templatetest-synced branch

concurrency: templatetest-sync   # prevent overlapping runs racing the synced branch

env:
  TEMPLATE_REF: templatetest
  SYNCED_REF: templatetest-synced
  INSTALLATION_ID: "148377690"

jobs:
  substitute-and-sync:
    runs-on: ubuntu-latest
    environment: hlx6-ca-central-1   # holds: secret GH_APP_WEBHOOK_SECRET, variable BASE_DOMAIN
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4
        with:
          ref: templatetest
          fetch-depth: 0

      - name: Fetch existing synced branch (if any)
        run: |
          if git fetch origin "$SYNCED_REF:refs/remotes/origin/$SYNCED_REF" 2>/dev/null; then
            echo "Found existing $SYNCED_REF - incremental diff is possible."
          else
            echo "No existing $SYNCED_REF (first run) - this run will full-sync regardless of mode."
          fi

      - name: Substitute {{BASE_DOMAIN}} with the per-customer value
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          if [ -z "$BASE_DOMAIN" ]; then
            echo "::error::Environment variable BASE_DOMAIN is not set on the 'hlx6-ca-central-1' environment"
            exit 1
          fi
          echo "Substituting {{BASE_DOMAIN}} -> $BASE_DOMAIN"
          COUNT=$(grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | wc -l | tr -d ' ')
          echo "files with token: $COUNT"
          grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | while read -r f; do
            sed -i "s/{{BASE_DOMAIN}}/$BASE_DOMAIN/g" "$f"
          done
          LEFT=$(grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | wc -l | tr -d ' ')
          echo "files still containing the token after substitution: $LEFT (expect 0)"

      - name: Build the substituted synced commit (incremental on templatetest-synced)
        id: synced
        run: |
          git config user.name "templatetest-sync"
          git config user.email "code-sync@ssa-eds.local"
          # The working tree now holds the substituted template content. Strip .github so the
          # synced branch never carries workflow files (the Actions GITHUB_TOKEN is not allowed
          # to create/update .github/workflows/*). .github is excluded from code-bus sync
          # anyway (.hlxignore starts with .*), so nothing of value is lost.
          rm -rf .github
          git add -A
          NEW_TREE=$(git write-tree)

          if git show-ref --verify --quiet "refs/remotes/origin/$SYNCED_REF"; then
            PARENT=$(git rev-parse "refs/remotes/origin/$SYNCED_REF")
            PARENT_TREE=$(git rev-parse "$PARENT^{tree}")
            echo "parent=$PARENT" >> "$GITHUB_OUTPUT"
            echo "first=false" >> "$GITHUB_OUTPUT"
            if [ "$NEW_TREE" = "$PARENT_TREE" ]; then
              echo "Substituted output is identical to the last synced build - nothing changed."
              echo "sha=$PARENT" >> "$GITHUB_OUTPUT"
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "$PARENT" \
              -m "chore: substituted build (BASE_DOMAIN=${{ vars.BASE_DOMAIN }}) from ${TEMPLATE_REF}@${GITHUB_SHA}")
          else
            echo "parent=" >> "$GITHUB_OUTPUT"
            echo "first=true" >> "$GITHUB_OUTPUT"
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" \
              -m "chore: substituted build (BASE_DOMAIN=${{ vars.BASE_DOMAIN }}) from ${TEMPLATE_REF}@${GITHUB_SHA}")
          fi

          # Update the local branch ref and push it (fast-forward; no -f, so a genuine
          # divergence fails loudly instead of clobbering).
          git update-ref "refs/heads/$SYNCED_REF" "$NEW_COMMIT"
          git push origin "refs/heads/$SYNCED_REF"
          echo "sha=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "Pushed $SYNCED_REF at $NEW_COMMIT"

      - name: Determine files to sync
        id: changed
        if: steps.synced.outputs.no_changes != 'true'
        env:
          MODE: ${{ inputs.mode }}
          FILES_INPUT: ${{ inputs.files }}
          FIRST: ${{ steps.synced.outputs.first }}
          PARENT: ${{ steps.synced.outputs.parent }}
          NEW_SHA: ${{ steps.synced.outputs.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess

          mode = os.environ["MODE"]
          files_input = os.environ["FILES_INPUT"].split()
          first = os.environ["FIRST"] == "true"
          parent = os.environ["PARENT"]
          new_sha = os.environ["NEW_SHA"]

          def emit(mode_out, added=None, modified=None, removed=None):
              with open("changed_files.json", "w") as f:
                  json.dump({"added": added or [], "modified": modified or [], "removed": removed or []}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"mode={mode_out}\n")

          # 1) Manual override always wins.
          if files_input:
              print(f"Manual file override: {files_input}")
              emit("changed-files", modified=files_input)
              raise SystemExit(0)

          # 2) Explicit full, or the first-ever sync of this ref (no parent to diff against).
          if mode == "full" or first:
              why = " (first sync of this ref - forced full)" if first and mode != "full" else ""
              print(f"Full sync{why}.")
              emit("full")
              raise SystemExit(0)

          # 3) Incremental: diff the previous synced build against this one.
          diff = subprocess.run(
              ["git", "diff", "--name-status", parent, new_sha],
              capture_output=True, text=True, check=True,
          ).stdout

          added, modified, removed = [], [], []
          for line in diff.splitlines():
              if not line.strip():
                  continue
              parts = line.split("\t")
              status, paths = parts[0], parts[1:]
              if status.startswith("A"):
                  added.append(paths[0])
              elif status.startswith("M"):
                  modified.append(paths[0])
              elif status.startswith("D"):
                  removed.append(paths[0])
              elif status.startswith("R"):
                  removed.append(paths[0])
                  added.append(paths[1])
              else:
                  modified.append(paths[-1])

          print(f"Changed files since last synced build ({parent[:10]} -> {new_sha[:10]}):")
          print(f"  added:    {added}")
          print(f"  modified: {modified}")
          print(f"  removed:  {removed}")
          emit("changed-files", added=added, modified=modified, removed=removed)
          PYEOF

      - name: Report no changes
        if: steps.synced.outputs.no_changes == 'true'
        run: |
          echo "Substituted output is identical to the last synced build - nothing to push or sync."

      - name: Build full/changed-files payload and signature
        id: payload
        if: steps.synced.outputs.no_changes != 'true'
        env:
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          SYNCED_SHA: ${{ steps.synced.outputs.sha }}
          MODE: ${{ steps.changed.outputs.mode }}
        run: |
          python3 - <<'PYEOF'
          import os, json, hmac, hashlib, datetime, uuid

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          ref = os.environ["SYNCED_REF"]
          sha = os.environ["SYNCED_SHA"]
          installation_id = int(os.environ["INSTALLATION_ID"])
          mode = os.environ["MODE"]
          secret = os.environ["GH_APP_WEBHOOK_SECRET"].encode("utf-8")
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          is_full = (mode == "full")
          with open("changed_files.json") as f:
              changes = json.load(f)

          # Mirrors push-handler.js: created=true => full recursive sync ('*'); otherwise the
          # commits[] added/modified/removed lists drive a targeted (changed-files) sync.
          commits = [] if is_full else [{
              "id": sha, "timestamp": ts,
              "added": changes["added"],
              "removed": changes["removed"],
              "modified": changes["modified"],
          }]

          payload = {
              "ref": f"refs/heads/{ref}",
              "created": is_full,
              "deleted": False,
              "forced": False,
              "after": sha,
              "head_commit": {"id": sha, "timestamp": ts},
              "repository": {
                  "full_name": f"{owner}/{repo}",
                  "name": repo,
                  "default_branch": "main",
                  "owner": {"name": owner},
              },
              "installation": {"id": installation_id},
              "commits": commits,
          }
          body = json.dumps(payload).encode("utf-8")
          with open("payload.json", "wb") as f:
              f.write(body)
          with open("signature.txt", "w") as f:
              f.write("sha256=" + hmac.new(secret, body, hashlib.sha256).hexdigest())
          with open("delivery_id.txt", "w") as f:
              f.write(str(uuid.uuid4()))
          print(f"Payload built (mode={mode}) for ref: {ref}")
          print(json.dumps(payload, indent=2))
          PYEOF

      - name: Trigger the sync (signed webhook to the customer admin)
        if: steps.synced.outputs.no_changes != 'true'
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          WEBHOOK_URL="https://admin.${BASE_DOMAIN}.page/hook/github"
          SIGNATURE=$(cat signature.txt)
          DELIVERY_ID=$(cat delivery_id.txt)
          echo "POST $WEBHOOK_URL"
          HTTP_CODE=$(curl -s -D headers.txt -o response.txt -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $DELIVERY_ID" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            --data-binary "@payload.json")
          echo "--- Response headers ---"; cat headers.txt
          echo "--- Response body ---"; cat response.txt; echo
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Webhook rejected with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Webhook accepted ($HTTP_CODE)"

      - name: Report preview URL
        if: steps.synced.outputs.no_changes != 'true'
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "Synced (mode=${{ steps.changed.outputs.mode }}). Verify the substituted build here (isolated from live main):"
          echo "  https://${SYNCED_REF}--${REPO}--${OWNER_LC}.${BASE_DOMAIN}.page/"
          echo "Compare against production main to confirm byte-identical rendering."
