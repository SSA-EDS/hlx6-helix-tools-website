name: hlx6-ca-central-1 - Sync to Customer Repo (BASE_DOMAIN)

# TEMPLATIZE TEST (SSA multi-customer DA code-sync RFC, Phase 3 / variant (a), repo-per-customer).
# Runs against this repo's `templatetest` branch (the template, with the customer domain
# replaced by the {{BASE_DOMAIN}} placeholder). On manual dispatch this workflow:
#   1. checks out templatetest,
#   2. substitutes {{BASE_DOMAIN}} -> the per-customer value (Environment variable),
#   3. commits the substituted result onto `main` of the customer's OWN private repo
#      (vars.DEST_REPO) as an INCREMENTAL commit (parent = that repo's previous main), so
#      its history can be diffed for changed-files syncs,
#   4. triggers a code-sync of that repo's `main` via a signed, simulated push webhook to
#      the customer's Helix admin (same mechanism as the prototype).
#
# Why a separate destination repo instead of a branch in this repo: real customer isolation.
# Each customer gets their own private repo (e.g. SSA-EDS/hlx6-ca-central-1-hlx6-helix-tools-website),
# its own repo ACL/team, its own App installation grant, and its own code-bus/site identity
# (the repo name is part of the delivery hostname) - none of which a branch-in-one-repo model
# could give us. This repo (hlx6-helix-tools-website) stays the shared, templatized upstream;
# it is never itself synced with placeholders substituted.
#
# Cross-repo push requires a credential with write access to the DESTINATION repo (the default
# GITHUB_TOKEN only grants access to the repo the workflow runs in) - see vars.DEST_REPO /
# secrets.DEST_REPO_TOKEN below. That PAT's blast radius is scoped to only that one customer
# repo, matching the isolation of every other per-customer secret in this Environment.
#
# Sync mode (manual input, like the code-sync bot):
#   * changed-files (default) - diffs this build against the destination repo's last synced
#       commit and syncs only the added/modified/removed files. Falls back to a full sync on
#       the first run (destination repo has no prior commit to diff against).
#   * full - forces a recursive re-sync of the entire ref.
# A blank run with no changes since the last build is a no-op (nothing is pushed or synced).
#
# Requires the GitHub App (helix-eds-ca) to be INSTALLED on the DESTINATION repo (added to its
# selected-repositories list - admin needs it for content access) but it can be event-
# UNSUBSCRIBED (no auto-trigger) - this workflow POSTs the webhook directly, unaffected by the
# App's event subscriptions. INSTALLATION_ID is the App's single org-wide installation id;
# it does not change per repo, but the App must still be granted access to each repo it syncs.
#
# Who can trigger this: the org's default repo permission is read-only, and GitHub requires
# write+ to dispatch a workflow - so only members of a customer-specific team explicitly
# granted write on THIS repo (hlx6-helix-tools-website) can run it.
#
# See: https://wiki.corp.adobe.com/spaces/MSTeam/pages/3990094266

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (changed-files diffs against the destination repo's last synced commit; full forces a recursive re-sync of everything)"
        required: true
        type: choice
        options:
          - changed-files
          - full
        default: changed-files
      files:
        description: "Space-separated file paths to sync (optional override; paths are as they appear in the code bus / post-substitution tree; leave blank to auto-detect)"
        required: false
        default: ""

permissions:
  contents: read   # this repo is only read from; the destination repo is written via PAT, not GITHUB_TOKEN

concurrency: hlx6-ca-central-1-sync-to-customer-repo   # prevent overlapping runs racing the destination repo's main

env:
  TEMPLATE_REF: templatetest

jobs:
  substitute-and-sync:
    runs-on: ubuntu-latest
    environment: hlx6-ca-central-1   # holds: secrets GH_APP_WEBHOOK_SECRET, DEST_REPO_TOKEN;
                                      # variables BASE_DOMAIN, DEST_REPO, INSTALLATION_ID
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4
        with:
          ref: templatetest
          fetch-depth: 0

      - name: Validate required config
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DEST_REPO: ${{ vars.DEST_REPO }}
          INSTALLATION_ID: ${{ vars.INSTALLATION_ID }}
        run: |
          MISSING=""
          [ -z "$BASE_DOMAIN" ] && MISSING="$MISSING vars.BASE_DOMAIN"
          [ -z "$DEST_REPO" ] && MISSING="$MISSING vars.DEST_REPO"
          [ -z "$INSTALLATION_ID" ] && MISSING="$MISSING vars.INSTALLATION_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required Environment config on 'hlx6-ca-central-1':$MISSING"
            exit 1
          fi
          echo "DEST_REPO=$DEST_REPO"
          echo "BASE_DOMAIN=$BASE_DOMAIN"

      - name: Add destination repo remote and fetch its current main (if any)
        env:
          DEST_REPO: ${{ vars.DEST_REPO }}
          DEST_REPO_TOKEN: ${{ secrets.DEST_REPO_TOKEN }}
        run: |
          git remote add dest "https://x-access-token:${DEST_REPO_TOKEN}@github.com/SSA-EDS/${DEST_REPO}.git"
          if git fetch dest main; then
            echo "Found existing dest main - incremental diff is possible."
          else
            echo "git fetch exit code: $? (expected/benign if the destination repo simply has no 'main' ref yet; a real auth failure will show as 'Repository not found' above, not just a nonzero exit)"
            echo "No existing dest main (first run) - this run will full-sync regardless of mode."
          fi

      - name: Substitute {{BASE_DOMAIN}} with the per-customer value
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          echo "Substituting {{BASE_DOMAIN}} -> $BASE_DOMAIN"
          COUNT=$(grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | wc -l | tr -d ' ')
          echo "files with token: $COUNT"
          grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | while read -r f; do
            sed -i "s/{{BASE_DOMAIN}}/$BASE_DOMAIN/g" "$f"
          done
          LEFT=$(grep -rl --exclude-dir=.git --exclude-dir=.github '{{BASE_DOMAIN}}' . | wc -l | tr -d ' ')
          echo "files still containing the token after substitution: $LEFT (expect 0)"

      - name: Build the substituted commit onto the destination repo's main
        id: synced
        run: |
          git config user.name "templatetest-sync"
          git config user.email "code-sync@ssa-eds.local"
          # The working tree now holds the substituted template content. Drop .github - the
          # destination repo doesn't need this repo's workflow files, and it keeps the pushed
          # tree limited to actual site content.
          rm -rf .github
          git add -A
          NEW_TREE=$(git write-tree)

          if git show-ref --verify --quiet refs/remotes/dest/main; then
            PARENT=$(git rev-parse refs/remotes/dest/main)
            PARENT_TREE=$(git rev-parse "$PARENT^{tree}")
            echo "parent=$PARENT" >> "$GITHUB_OUTPUT"
            echo "first=false" >> "$GITHUB_OUTPUT"
            if [ "$NEW_TREE" = "$PARENT_TREE" ]; then
              echo "Substituted output is identical to the destination repo's current main - nothing changed."
              echo "sha=$PARENT" >> "$GITHUB_OUTPUT"
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "$PARENT" \
              -m "chore: substituted build (BASE_DOMAIN=${{ vars.BASE_DOMAIN }}) from ${TEMPLATE_REF}@${GITHUB_SHA}")
          else
            echo "parent=" >> "$GITHUB_OUTPUT"
            echo "first=true" >> "$GITHUB_OUTPUT"
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" \
              -m "chore: substituted build (BASE_DOMAIN=${{ vars.BASE_DOMAIN }}) from ${TEMPLATE_REF}@${GITHUB_SHA}")
          fi

          # Fast-forward push (no -f) - a genuine divergence on the destination repo fails
          # loudly instead of silently clobbering someone else's change to it.
          git push dest "$NEW_COMMIT:refs/heads/main"
          echo "sha=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"
          echo "Pushed dest main at $NEW_COMMIT"

      - name: Determine files to sync
        id: changed
        if: steps.synced.outputs.no_changes != 'true'
        env:
          MODE: ${{ inputs.mode }}
          FILES_INPUT: ${{ inputs.files }}
          FIRST: ${{ steps.synced.outputs.first }}
          PARENT: ${{ steps.synced.outputs.parent }}
          NEW_SHA: ${{ steps.synced.outputs.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess

          mode = os.environ["MODE"]
          files_input = os.environ["FILES_INPUT"].split()
          first = os.environ["FIRST"] == "true"
          parent = os.environ["PARENT"]
          new_sha = os.environ["NEW_SHA"]

          def emit(mode_out, added=None, modified=None, removed=None):
              with open("changed_files.json", "w") as f:
                  json.dump({"added": added or [], "modified": modified or [], "removed": removed or []}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"mode={mode_out}\n")

          # 1) Manual override always wins.
          if files_input:
              print(f"Manual file override: {files_input}")
              emit("changed-files", modified=files_input)
              raise SystemExit(0)

          # 2) Explicit full, or the first-ever sync of this destination repo (no parent to diff against).
          if mode == "full" or first:
              why = " (first sync of destination repo - forced full)" if first and mode != "full" else ""
              print(f"Full sync{why}.")
              emit("full")
              raise SystemExit(0)

          # 3) Incremental: diff the previous destination-repo commit against this one.
          diff = subprocess.run(
              ["git", "diff", "--name-status", parent, new_sha],
              capture_output=True, text=True, check=True,
          ).stdout

          added, modified, removed = [], [], []
          for line in diff.splitlines():
              if not line.strip():
                  continue
              parts = line.split("\t")
              status, paths = parts[0], parts[1:]
              if status.startswith("A"):
                  added.append(paths[0])
              elif status.startswith("M"):
                  modified.append(paths[0])
              elif status.startswith("D"):
                  removed.append(paths[0])
              elif status.startswith("R"):
                  removed.append(paths[0])
                  added.append(paths[1])
              else:
                  modified.append(paths[-1])

          print(f"Changed files since last synced build ({parent[:10]} -> {new_sha[:10]}):")
          print(f"  added:    {added}")
          print(f"  modified: {modified}")
          print(f"  removed:  {removed}")
          emit("changed-files", added=added, modified=modified, removed=removed)
          PYEOF

      - name: Report no changes
        if: steps.synced.outputs.no_changes == 'true'
        run: |
          echo "Substituted output is identical to the destination repo's current main - nothing to push or sync."

      - name: Build full/changed-files payload and signature
        id: payload
        if: steps.synced.outputs.no_changes != 'true'
        env:
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          DEST_REPO: ${{ vars.DEST_REPO }}
          INSTALLATION_ID: ${{ vars.INSTALLATION_ID }}
          SYNCED_SHA: ${{ steps.synced.outputs.sha }}
          MODE: ${{ steps.changed.outputs.mode }}
        run: |
          python3 - <<'PYEOF'
          import os, json, hmac, hashlib, datetime, uuid

          owner = "SSA-EDS"
          repo = os.environ["DEST_REPO"]
          ref = "main"
          sha = os.environ["SYNCED_SHA"]
          installation_id = int(os.environ["INSTALLATION_ID"])
          mode = os.environ["MODE"]
          secret = os.environ["GH_APP_WEBHOOK_SECRET"].encode("utf-8")
          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          is_full = (mode == "full")
          with open("changed_files.json") as f:
              changes = json.load(f)

          # Mirrors push-handler.js: created=true => full recursive sync ('*'); otherwise the
          # commits[] added/modified/removed lists drive a targeted (changed-files) sync.
          commits = [] if is_full else [{
              "id": sha, "timestamp": ts,
              "added": changes["added"],
              "removed": changes["removed"],
              "modified": changes["modified"],
          }]

          payload = {
              "ref": f"refs/heads/{ref}",
              "created": is_full,
              "deleted": False,
              "forced": False,
              "after": sha,
              "head_commit": {"id": sha, "timestamp": ts},
              "repository": {
                  "full_name": f"{owner}/{repo}",
                  "name": repo,
                  "default_branch": ref,
                  "owner": {"name": owner},
              },
              "installation": {"id": installation_id},
              "commits": commits,
          }
          body = json.dumps(payload).encode("utf-8")
          with open("payload.json", "wb") as f:
              f.write(body)
          with open("signature.txt", "w") as f:
              f.write("sha256=" + hmac.new(secret, body, hashlib.sha256).hexdigest())
          with open("delivery_id.txt", "w") as f:
              f.write(str(uuid.uuid4()))
          print(f"Payload built (mode={mode}) for {owner}/{repo}@{ref}")
          print(json.dumps(payload, indent=2))
          PYEOF

      - name: Trigger the sync (signed webhook to the customer admin)
        if: steps.synced.outputs.no_changes != 'true'
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          WEBHOOK_URL="https://admin.${BASE_DOMAIN}.page/hook/github"
          SIGNATURE=$(cat signature.txt)
          DELIVERY_ID=$(cat delivery_id.txt)
          echo "POST $WEBHOOK_URL"
          HTTP_CODE=$(curl -s -D headers.txt -o response.txt -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $DELIVERY_ID" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            --data-binary "@payload.json")
          echo "--- Response headers ---"; cat headers.txt
          echo "--- Response body ---"; cat response.txt; echo
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::Webhook rejected with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Webhook accepted ($HTTP_CODE)"

      - name: Report preview URL
        if: steps.synced.outputs.no_changes != 'true'
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          DEST_REPO: ${{ vars.DEST_REPO }}
        run: |
          OWNER_LC="ssa-eds"
          echo "Synced (mode=${{ steps.changed.outputs.mode }}). Verify the substituted build here (isolated, own repo):"
          echo "  https://main--${DEST_REPO}--${OWNER_LC}.${BASE_DOMAIN}.page/"
          echo "Compare against production main (of hlx6-helix-tools-website) to confirm byte-identical rendering."
